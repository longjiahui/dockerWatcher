<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Docker Watcher</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Docker Watcher</span>
        <span class="count" id="count" data-tauri-drag-region>0 项</span>
        <span class="drag-fill" data-tauri-drag-region></span>
        <span
          class="docker-dot offline"
          id="docker-dot"
          role="img"
          aria-label="Docker 连接状态"
          title="Docker 未连接"
        ></span>
        <button class="bar-btn" id="clear-btn" type="button" title="清空列表与日志">清空</button>
        <button class="bar-btn close" id="close-btn" type="button" title="隐藏窗口">×</button>
      </header>

      <div class="banner" id="banner" hidden></div>
      <div class="docker-error" id="docker-error" hidden></div>

      <div class="list-scroll" id="list-scroll">
        <div id="list"></div>
        <div class="empty" id="empty">暂无容器，等待 Docker 事件…</div>
      </div>
    </div>
  </body>
</html>
